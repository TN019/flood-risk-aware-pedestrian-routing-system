[project]
name = "flood-risk-routing"
version = "0.1.0"
description = "Flood risk-aware pedestrian routing for Southbank, Melbourne"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "osmnx>=2.0",
    "folium>=0.17",
    "requests>=2.32",
    "streamlit>=1.66.0",
    "streamlit-folium>=0.27.4",
    "streamlit-js-eval>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
