[project]
name = "floodroute"
version = "0.1.0"
description = "Flood risk-aware pedestrian routing for Southbank, Melbourne"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "osmnx>=2.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
]
# Map rendering for the build scripts, and the interim Streamlit app.
tools = [
    "folium>=0.17",
    "streamlit>=1.66.0",
    "streamlit-folium>=0.27.4",
    "streamlit-js-eval>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodroute"]

[tool.uv]
default-groups = ["dev", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax for the target Python
    "SIM",     # simplifications
    "RUF",     # ruff-specific checks
]

# Intentional symbols in formulas and text: multiplication sign, en dash, alpha.
allowed-confusables = ["×", "–", "α"]

[tool.ruff.lint.isort]
known-first-party = ["floodroute"]

[tool.ruff.format]
quote-style = "double"
