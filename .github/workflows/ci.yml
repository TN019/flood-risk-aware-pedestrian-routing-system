name: CI

# Every pull request and every push to main: lint, format and tests for the routing engine and
# API, and the type check, build and tests of the web client. Tests that need the downloaded and
# processed Southbank data skip themselves; run them locally (see CONTRIBUTING.md).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../deploy
      - name: Formatting
        run: uv run ruff format --check . ../deploy
      - name: Tests
        run: uv run pytest

  frontend:
    name: Web client (type check, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Tests
        run: npm test
